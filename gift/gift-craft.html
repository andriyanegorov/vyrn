<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Симулятор крафта подарков</title>
<link rel="stylesheet" href="gift-craft.css">
</head>
<body>
<div id="app">
  <div class="top">
    <button class="round" id="addMore" title="Получить подарки">＋</button>
    <div class="title"><b>@gift_lab 🎂</b><small id="cnt"></small></div>
    <select class="mode" id="mode">
      <option value="rand">🎲 Честно</option>
      <option value="win">✅ Всегда успех</option>
      <option value="lose">❌ Всегда провал</option>
    </select>
  </div>
  <div class="bar">
    <button class="pill main" id="openCraft">⚒ Создать подарок</button>
  </div>
  <div class="note">Демо-симулятор: подарки нарисованы в коде, ничего настоящего здесь нет. Нажми на подарок, чтобы положить его в крафт.</div>
  <div id="grid"></div>

  <div class="sheet-bg" id="bg1"></div>
  <div class="sheet craft" id="craftSheet">
    <button class="round" id="closeCraft">✕</button>
    <button class="round help" id="helpBtn">?</button>
    <h3>Крафт подарка</h3>
    <div class="cwrap">
      <div class="slot s0" data-i="0"></div><div class="slot s1" data-i="1"></div>
      <div class="slot s2" data-i="2"></div><div class="slot s3" data-i="3"></div>
      <div class="center">
        <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/><path id="ringC" d="M21.8 98.2 A54 54 0 1 1 98.2 98.2" pathLength="100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset .5s"/></svg>
        <img class="anv" src="./anvil.svg" alt="Наковальня с молотом">
        <div class="pc" id="pcTxt">0%</div>
      </div>
    </div>
    <div class="info" id="info"></div>
    <div class="chips" id="chips"></div>
    <button class="variants" id="variants">🍰🍰🍰 Все новые варианты ›</button>
    <button class="go off" id="goBtn"></button>
  </div>

  <div class="sheet" id="pickSheet">
    <h3>Выбери подарок</h3>
    <div class="pick" id="pick"></div>
  </div>
  <div class="sheet-bg" id="bg2" style="z-index:12"></div>
  <div class="sheet" id="varSheet" style="z-index:14">
    <h3>Возможные варианты</h3>
    <div class="pick" id="varList"></div>
  </div>

  <div id="crafting">
    <div class="stage" id="stage"></div>
    <div class="ctext">
      <h2>Создание подарка</h2>
      <p id="cNum"></p>
      <p class="fail">При неудаче все выбранные подарки сгорят.</p>
      <div class="pc2" id="cPc"></div>
    </div>
  </div>
  <div id="result"></div>
  <canvas id="conf"></canvas>
  <div class="toast" id="toast"></div>
</div>

<script src="gift-craft.js"></script>
</body>
</html>
