<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Крафт NFT | VYRN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gift-craft.css?v=craft-skeleton-shimmer-v8">
</head>
<body>
<div id="app">
  <header class="top">
    <a class="brand" href="../index.html" aria-label="VYRN, главная">VYRN</a>
    <small class="inventory-count" id="cnt"></small>
    <a class="star-balance" href="../wallet.html" aria-label="Баланс: 0 звёзд">
      <img src="../assets/stars.png" alt="" aria-hidden="true">
      <span>0</span>
    </a>
  </header>
  <div class="bar">
    <img class="craft-banner" src="../assets/craft.png" alt="Крафт NFT">
    <button class="pill main" id="openCraft">Скрафтить NFT</button>
  </div>
  <div class="note">Выбери NFT из своей коллекции. Результат крафта рассчитывается и сохраняется на сервере.</div>
  <div id="grid"></div>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <span class="nav-indicator" aria-hidden="true"></span>
    <a class="nav-button is-active" href="../index.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6" /></svg>
      <span>Главное</span>
    </a>
    <a class="nav-button" href="../market.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18l-1.5-6h-15L3 10Zm0 0v10h18V10M8 20v-6h8v6" /></svg>
      <span>Рынок</span>
    </a>
    <a class="nav-button" href="../chats.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z" /></svg>
      <span>Чаты</span>
    </a>
    <a class="nav-button" href="../profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
      <span>Профиль</span>
    </a>
  </nav>

  <div class="sheet-bg" id="bg1"></div>
  <div class="sheet craft" id="craftSheet">
    <button class="round" id="closeCraft">✕</button>
    <button class="round help" id="helpBtn">?</button>
    <h3>Крафт NFT</h3>
    <div class="cwrap">
      <div class="slot s0" data-i="0"></div><div class="slot s1" data-i="1"></div>
      <div class="slot s2" data-i="2"></div><div class="slot s3" data-i="3"></div>
      <div class="center">
        <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/><path id="ringC" d="M21.8 98.2 A54 54 0 1 1 98.2 98.2" pathLength="100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset .5s"/></svg>
        <img class="anv" src="./anvil.svg" alt="Наковальня с молотом">
        <div class="pc" id="pcTxt">0%</div>
      </div>
    </div>
    <div class="info" id="info"></div>
    <div class="chips" id="chips"></div>
    <button class="variants" id="variants">Показать выбранные NFT</button>
    <button class="go off" id="goBtn"></button>
  </div>

  <div class="sheet" id="pickSheet">
    <h3>Выбери NFT</h3>
    <div class="pick" id="pick"></div>
  </div>
  <div class="sheet-bg" id="bg2" style="z-index:12"></div>
  <div class="sheet" id="varSheet" style="z-index:14">
    <h3>Выбранные NFT</h3>
    <div class="pick" id="varList"></div>
  </div>

  <div id="crafting">
    <div class="stage" id="stage"></div>
    <div class="ctext">
      <h2>Создание подарка</h2>
      <p id="cNum"></p>
      <p class="fail">При неудаче все выбранные NFT сгорят.</p>
      <div class="pc2" id="cPc"></div>
    </div>
  </div>
  <div id="result"></div>
  <canvas id="conf"></canvas>
  <div class="toast" id="toast"></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="../supabase-client-config.js?v=craft-nft-20261021"></script>
<script src="../supabase-api.js?v=market-cache-validation-v2"></script>
<script src="../nav-transition.js?v=section-swipe-v8"></script>
<script src="gift-craft.js?v=craft-skeleton-shimmer-v2"></script>
</body>
</html>
