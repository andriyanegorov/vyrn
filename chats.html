<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чаты | VYRN</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="chats-screen">
  <header class="site-header">
    <a class="brand" href="index.html#home" aria-label="VYRN, главная">VYRN</a>
    <div class="star-balance" aria-label="Баланс: 12 450 звёзд">
      <img src="stars.png" alt="" aria-hidden="true">
      <span>12 450</span>
    </div>
  </header>
  <main class="chats-page">
    <section class="chat-list" aria-label="Список чатов">
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-1" aria-hidden="true">👩🏻</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">моя радость ❤️</span><span class="chat-time chat-time-read"><span aria-hidden="true">✓✓</span> 14:15</span></span>
          <span class="chat-preview"><span class="chat-message">спокойной ночи, любимый</span><span class="chat-side chat-heart">♥</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-2" aria-hidden="true">W</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name"><svg class="chat-kind-icon" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7.2v3.6h2.4l4 3V4.2l-4 3H3Zm8.2-.8a3.8 3.8 0 0 1 0 5.2m1.9-7.1a6.5 6.5 0 0 1 0 9"/></svg>Whoosh: транспорт для города <span class="chat-verified" aria-label="Подтверждённый аккаунт"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 8 2.5 2.5L12 5"/></svg></span></span><span class="chat-time">14:27</span></span>
          <span class="chat-preview"><span class="chat-message">Новые поездки уже доступны в приложении</span><span class="chat-side chat-unread">25</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-3" aria-hidden="true">Б</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name"><svg class="chat-kind-icon chat-group-icon" viewBox="0 0 18 18" aria-hidden="true"><circle cx="6" cy="5.2" r="2.2"/><circle cx="12.4" cy="6" r="1.8"/><path d="M1.8 14.5c.2-3 1.7-4.6 4.2-4.6s4 1.6 4.2 4.6m.1-3.6c2.5-.8 4.8.3 5.1 3.2"/></svg>Барахолка техники • Чебоксары</span><span class="chat-time">14:20</span></span>
          <span class="chat-preview"><span class="chat-message">ПРОДАЖА: iPhone 16 Pro, отличное состояние</span><span class="chat-side chat-muted-count">3</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-4" aria-hidden="true">🎭</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Подвал Феннелиста</span><span class="chat-time">14:13</span></span>
          <span class="chat-preview"><span class="chat-message">ща ща, всё будет</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-5" aria-hidden="true">✦</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Радар Чувашия</span><span class="chat-time">14:10</span></span>
          <span class="chat-preview"><span class="chat-message">Обстановка спокойная, новых сообщений нет</span><span class="chat-side chat-unread">2</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-6" aria-hidden="true">V</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Команда VYRN</span><span class="chat-time">13:58</span></span>
          <span class="chat-preview"><span class="chat-message">Вы: отправил новый макет профиля</span><span class="chat-side chat-read">✓✓</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-7" aria-hidden="true">М</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Маша К.</span><span class="chat-time">13:42</span></span>
          <span class="chat-preview"><span class="chat-message">голосовое сообщение</span><span class="chat-side chat-muted-count">0:18</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-8" aria-hidden="true">🌿</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Домашние растения</span><span class="chat-time">13:26</span></span>
          <span class="chat-preview"><span class="chat-message">Ирина: вот так выглядит после пересадки</span><span class="chat-side chat-unread">8</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-9" aria-hidden="true">📦</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Пункт выдачи • новости</span><span class="chat-time">13:04</span></span>
          <span class="chat-preview"><span class="chat-message">Заказ готов к получению до 21:00</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-10" aria-hidden="true">D</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Денис Орлов</span><span class="chat-time">12:51</span></span>
          <span class="chat-preview"><span class="chat-message">кинул тебе ссылку, посмотри</span><span class="chat-side chat-unread">1</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-11" aria-hidden="true">🍕</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Пицца рядом</span><span class="chat-time">12:35</span></span>
          <span class="chat-preview"><span class="chat-message">Ваш заказ уже у курьера</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-12" aria-hidden="true">С</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Соседи, дом 12</span><span class="chat-time">12:18</span></span>
          <span class="chat-preview"><span class="chat-message">Ольга: спасибо, забрали посылку</span><span class="chat-side chat-unread">4</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-13" aria-hidden="true">N</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Новости технологий <span class="chat-verified" aria-label="Подтверждённый аккаунт"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 8 2.5 2.5L12 5"/></svg></span></span><span class="chat-time">11:56</span></span>
          <span class="chat-preview"><span class="chat-message">Что показали на презентации этой недели</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-14" aria-hidden="true">✈</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">В поездку! • планируем вместе</span><span class="chat-time">11:32</span></span>
          <span class="chat-preview"><span class="chat-message">Сбор в аэропорту в 06:30</span><span class="chat-side chat-unread">12</span></span>
        </span>
      </button>
      <button class="chat-row" type="button">
        <span class="chat-avatar avatar-15" aria-hidden="true">☕</span>
        <span class="chat-copy">
          <span class="chat-heading"><span class="chat-name">Кофейня «На углу»</span><span class="chat-time">10:47</span></span>
          <span class="chat-preview"><span class="chat-message">Сегодня новый сезонный напиток</span></span>
        </span>
      </button>
    </section>
  </main>
  <dialog class="conversation-dialog" aria-label="Переписка">
    <section class="conversation-screen">
      <header class="conversation-header">
        <button class="conversation-back" type="button" aria-label="Назад к чатам">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12" /></svg>
        </button>
        <button class="conversation-peer" type="button" aria-label="Открыть профиль собеседника">
          <span class="conversation-avatar-slot"></span>
          <span class="conversation-peer-copy">
            <strong class="conversation-peer-name"></strong>
            <span class="conversation-peer-status">был(а) недавно</span>
          </span>
        </button>
        <div class="conversation-actions">
          <button type="button" aria-label="Позвонить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-8-8l2-2-2-5Z" /></svg>
          </button>
          <button type="button" aria-label="Ещё">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          </button>
        </div>
      </header>
      <div class="conversation-messages" aria-live="polite">
        <span class="conversation-date">сегодня</span>
        <div class="conversation-message-list"></div>
      </div>
      <form class="conversation-composer">
        <button class="conversation-gif" type="button" aria-label="GIF">GIF</button>
        <input class="conversation-input" type="text" placeholder="Сообщение" autocomplete="off" aria-label="Сообщение">
        <button class="conversation-attach" type="button" aria-label="Прикрепить файл">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12.5 7.1-7.1a4 4 0 0 1 5.7 5.7L10 21.9a6 6 0 0 1-8.5-8.5L12 2.9" /></svg>
        </button>
        <button class="conversation-send" type="submit" aria-label="Отправить сообщение">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2.5-7.5L3 11Zm7.5 2.5L21 3" /></svg>
        </button>
      </form>
    </section>
    <section class="conversation-profile player-profile-view" hidden>
      <button class="profile-edit-button player-profile-back" type="button" aria-label="Назад к переписке">Назад</button>
      <main class="profile-page player-profile-page">
        <div class="profile-content">
          <section class="profile-summary" aria-labelledby="player-profile-name">
            <button class="profile-avatar" type="button" aria-label="Увеличить аватар" aria-expanded="false">V</button>
            <h1 class="profile-name" id="player-profile-name"></h1>
            <p class="profile-status"></p>
          </section>
          <section class="profile-details" aria-label="Информация профиля">
            <div class="profile-detail">
              <h2 class="profile-detail-label">Имя пользователя</h2>
              <p class="profile-detail-value player-profile-username"></p>
            </div>
            <div class="profile-detail">
              <h2 class="profile-detail-label">О себе</h2>
              <p class="profile-detail-value player-profile-bio"></p>
            </div>
          </section>
          <button class="profile-nft-button" type="button">NFT</button>
          <section class="profile-nft-grid player-profile-nft-grid" aria-label="NFT игрока"></section>
        </div>
      </main>
    </section>
    <dialog class="nft-modal" aria-labelledby="nft-modal-title">
      <section class="nft-modal-card">
        <div class="nft-modal-art">
          <div class="nft-modal-backdrop" aria-hidden="true" hidden></div>
          <button class="nft-modal-close" type="button" aria-label="Закрыть окно" autofocus>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
          <div class="nft-modal-animation" aria-hidden="true" hidden></div>
          <div class="nft-modal-heading">
            <h2 id="nft-modal-title"></h2>
            <p class="nft-modal-collection">Коллекция VYRN</p>
          </div>
        </div>
        <div class="nft-modal-details">
          <dl class="nft-modal-metadata">
            <div><dt>Коллекция</dt><dd>VYRN</dd></div>
            <div><dt>Модель</dt><dd class="nft-modal-model"></dd></div>
            <div><dt>Формат</dt><dd>Telegram TGS-анимация</dd></div>
            <div><dt>Источник</dt><dd><a class="nft-modal-file" target="_blank" rel="noopener noreferrer"></a></dd></div>
          </dl>
          <button class="nft-modal-confirm" type="button">OK</button>
        </div>
      </section>
    </dialog>
  </dialog>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <span class="nav-indicator" aria-hidden="true"></span>
    <a class="nav-button" href="index.html#home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6" /></svg>
      <span>Главное</span>
    </a>
    <button class="nav-button" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18l-1.5-6h-15L3 10Zm0 0v10h18V10M8 20v-6h8v6" /></svg>
      <span>Рынок</span>
    </button>
    <a class="nav-button is-active" href="chats.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z" /></svg>
      <span>Чаты</span>
    </a>
    <a class="nav-button" href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
      <span>Профиль</span>
    </a>
  </nav>
</body>
</html>
