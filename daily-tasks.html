<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <title>Ежедневные задания | VYRN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=premium-badge-click-v1">
  <link rel="stylesheet" href="daily-tasks.css?v=daily-tasks-complete-v2">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="supabase-client-config.js?v=wallet-balance-read-20261018" defer></script>
  <script src="supabase-api.js?v=insufficient-stars-routing-v1" defer></script>
  <script src="nav-transition.js?v=nav-unselected-fade-v1" defer></script>
  <script src="script.js?v=custom-tgs-nft-v1" defer></script>
  <script src="daily-tasks.js?v=daily-tasks-complete-v1" defer></script>
</head>
<body class="daily-tasks-screen">
  <header class="site-header">
    <a class="brand" href="index.html#home" aria-label="VYRN, главная">VYRN</a>
    <div class="star-balance" aria-label="Баланс: 0 звёзд">
      <img src="./assets/stars.png" alt="" aria-hidden="true">
      <span>0</span>
    </div>
  </header>
  <main class="daily-tasks-page">
    <div class="daily-tasks-tabs" role="tablist" aria-label="Период заданий">
      <span class="daily-tasks-tab-indicator" aria-hidden="true"></span>
      <button class="daily-tasks-tab is-active" id="daily-tab" type="button" role="tab" aria-selected="true" aria-controls="daily-panel" data-task-period="daily">Ежедневные</button>
      <button class="daily-tasks-tab" id="weekly-tab" type="button" role="tab" aria-selected="false" aria-controls="weekly-panel" data-task-period="weekly" tabindex="-1">Еженедельные</button>
    </div>

    <section class="daily-tasks-progress" aria-live="polite">
      <span class="daily-tasks-progress-icon" aria-hidden="true">
        <img src="./assets/svg/progress.svg" alt="">
      </span>
      <div class="daily-tasks-progress-copy">
        <strong data-progress-title>Твой прогресс сегодня</strong>
        <div class="daily-tasks-progress-track"><span data-progress-fill style="width:0%"></span></div>
      </div>
      <span class="daily-tasks-progress-count" data-progress-count>0 / 0</span>
      <span class="daily-tasks-progress-reward"><img src="./assets/stars.png" alt="" aria-hidden="true"><span data-progress-reward>+0</span></span>
    </section>

    <p class="daily-tasks-demo-note" role="status" aria-live="polite">Загружаем задания…</p>

    <section class="daily-tasks-panel" id="daily-panel" role="tabpanel" aria-labelledby="daily-tab" data-task-panel="daily">
      <div class="daily-tasks-section-heading">
        <h2>Популярные задания</h2>
        <span data-period-reset="daily"></span>
      </div>
      <div class="daily-task-list" data-task-list="daily" aria-live="polite"></div>
    </section>

    <section class="daily-tasks-panel" id="weekly-panel" role="tabpanel" aria-labelledby="weekly-tab" data-task-panel="weekly" hidden>
      <div class="daily-tasks-section-heading">
        <h2>Задания недели</h2>
        <span data-period-reset="weekly"></span>
      </div>
      <div class="daily-task-list" data-task-list="weekly" aria-live="polite"></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <span class="nav-indicator" aria-hidden="true"></span>
    <a class="nav-button" href="index.html#home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6" /></svg>
      <span>Главное</span>
    </a>
    <a class="nav-button" href="market.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18l-1.5-6h-15L3 10Zm0 0v10h18V10M8 20v-6h8v6" /></svg>
      <span>Рынок</span>
    </a>
    <a class="nav-button" href="chats.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z" /></svg>
      <span>Чаты</span>
    </a>
    <a class="nav-button" href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
      <span>Профиль</span>
    </a>
  </nav>
</body>
</html>
