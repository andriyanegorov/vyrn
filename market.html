<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рынок | VYRN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=banner-gradient-v2">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>
  <script src="supabase-client-config.js?v=wallet-balance-read-20261018" defer></script>
  <script src="supabase-api.js?v=local-cache-v1" defer></script>
  <script src="script.js?v=banner-gradient-v3" defer></script>
</head>
<body class="market-screen">
  <header class="site-header">
    <a class="brand" href="index.html#home" aria-label="Рынок VYRN">VYRN</a>
    <div class="star-balance" aria-label="Баланс: 0 звёзд">
      <img src="./assets/stars.png" alt="" aria-hidden="true">
      <span>0</span>
    </div>
  </header>
  <main class="market-page">
    <section class="market-tools" aria-label="Коллекция, сортировка и фильтры рынка">
      <label class="market-collection-select">
        <span class="visually-hidden">Коллекция</span>
        <select class="market-collection-filter" aria-label="Фильтр коллекции">
          <option value="">Все коллекции</option>
        </select>
      </label>
      <label class="market-sort-select">
        <span class="visually-hidden">Сортировка</span>
        <select class="market-sort" aria-label="Сортировка подарков">
          <option value="name">По названию</option>
          <option value="price-asc">Цена: сначала дешевле</option>
          <option value="price-desc">Цена: сначала дороже</option>
        </select>
      </label>
      <button class="market-filter-open" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10m-7 5h4"/><circle cx="8" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="12" cy="17" r="2"/></svg>
        <span>Фильтр</span>
      </button>
    </section>
    <nav class="market-trade-nav" aria-label="Разделы рынка">
      <span class="market-trade-indicator" aria-hidden="true"></span>
      <button class="market-trade-button is-active" type="button" data-market-mode="all" aria-pressed="true">Все</button>
      <button class="market-trade-button" type="button" data-market-mode="sales" aria-pressed="false">Продажи</button>
      <button class="market-trade-button" type="button" data-market-mode="purchases" aria-pressed="false">Покупки</button>
    </nav>
    <section class="market-grid" aria-label="Подарки на рынке"></section>
    <p class="market-empty" hidden>Ничего не найдено</p>
  </main>
  <dialog class="market-filter-dialog" aria-labelledby="market-filter-title">
    <form class="market-filter-panel">
      <div class="market-filter-heading">
        <h2 id="market-filter-title">Фильтры</h2>
        <button class="market-filter-close" type="button" aria-label="Закрыть фильтры">×</button>
      </div>
      <label class="market-model-select">
        <span>Модель</span>
        <select class="market-model-filter" aria-label="Фильтр модели">
          <option value="">Все модели</option>
        </select>
      </label>
      <label class="market-backdrop-select">
        <span>Фон</span>
        <select class="market-backdrop-filter" aria-label="Фильтр фона">
          <option value="">Все фоны</option>
        </select>
      </label>
      <label class="market-symbol-select">
        <span>Символ</span>
        <select class="market-symbol-filter" aria-label="Фильтр символа">
          <option value="">Все символы</option>
        </select>
      </label>
      <p class="market-filter-status" role="status" aria-live="polite"></p>
      <div class="market-filter-actions">
        <button class="market-filter-reset" type="button">Сбросить</button>
        <button class="market-filter-apply" type="submit">Применить</button>
      </div>
    </form>
  </dialog>
  <dialog class="nft-modal" aria-labelledby="nft-modal-title">
    <section class="nft-modal-card">
      <div class="nft-modal-art">
        <div class="nft-modal-backdrop" aria-hidden="true" hidden></div>
        <button class="nft-modal-close" type="button" aria-label="Закрыть окно">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
        <div class="nft-modal-animation" aria-hidden="true" hidden></div>
        <div class="nft-modal-heading">
          <h2 id="nft-modal-title"></h2>
          <p class="nft-modal-collection">Коллекция VYRN</p>
        </div>
      </div>
      <div class="nft-modal-details">
        <dl class="nft-modal-metadata">
          <div><dt>Владелец</dt><dd class="nft-modal-owner"><div class="nft-modal-owner-actions"><button class="nft-modal-owner-link" type="button"><img class="nft-modal-owner-avatar" alt="" hidden><span class="nft-modal-owner-name"></span></button></div></dd></div>
          <div><dt>Коллекция</dt><dd class="nft-modal-collection-name">VYRN</dd></div>
          <div><dt>Модель</dt><dd class="nft-modal-model"></dd></div>
          <div><dt>Цена</dt><dd class="nft-modal-price">—</dd></div>
        </dl>
        <div class="nft-modal-error" role="alert" hidden>
          <span data-nft-modal-error></span>
          <a href="wallet.html">Открыть кошелёк</a>
        </div>
        <button class="nft-modal-confirm" type="button">Закрыть</button>
      </div>
    </section>
  </dialog>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <span class="nav-indicator" aria-hidden="true"></span>
    <a class="nav-button" href="index.html#home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6" /></svg>
      <span>Главное</span>
    </a>
    <a class="nav-button is-active" href="market.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18l-1.5-6h-15L3 10Zm0 0v10h18V10M8 20v-6h8v6" /></svg>
      <span>Рынок</span>
    </a>
    <a class="nav-button" href="chats.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z" /></svg>
      <span>Чаты</span>
    </a>
    <a class="nav-button" href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
      <span>Профиль</span>
    </a>
  </nav>
</body>
</html>
