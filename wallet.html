<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0eff4">
  <title>Деньги | VYRN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=premium-badge-click-v1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="supabase-client-config.js?v=wallet-data-20261019" defer></script>
  <script src="supabase-api.js?v=insufficient-stars-routing-v1" defer></script>
  <script src="nav-transition.js?v=nav-unselected-fade-v1" defer></script>
  <script src="script.js?v=insufficient-stars-premium-v1" defer></script>
</head>
<body class="wallet-screen">
  <header class="wallet-header">
    <a class="wallet-back" href="index.html#home" aria-label="Назад">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
    </a>
    <h1>Кошелёк</h1>
    <div class="wallet-header-actions">
      <button class="wallet-header-button is-more" type="button" aria-label="Ещё" aria-expanded="false" aria-controls="wallet-more-menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <div class="wallet-more-menu" id="wallet-more-menu" hidden>
        <button class="wallet-menu-item wallet-promo-open" type="button" aria-haspopup="dialog" aria-controls="wallet-promo-dialog">
          <svg class="wallet-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 0 6.5 5h11A2.5 2.5 0 0 0 20 7.5v1a2.5 2.5 0 0 0 0 5v1a2.5 2.5 0 0 0-2.5 2.5h-11A2.5 2.5 0 0 0 4 14.5v-1a2.5 2.5 0 0 0 0-5z"/><path d="M12 8v1m0 3v1m0 3v.01"/></svg>
          <span>Промокод</span>
        </button>
        <button class="wallet-menu-item wallet-transfer-action" type="button" disabled title="Переводы пока недоступны">
          <svg class="wallet-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h17l-4-4m5 12H4l4 4"/></svg>
          <span>Перевести</span>
        </button>
        <button class="wallet-menu-item wallet-currency-toggle" type="button" aria-expanded="false" aria-controls="wallet-currency-options">
          <svg class="wallet-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          <span class="wallet-menu-copy">
            <span>Валюта</span>
            <span class="wallet-menu-current">STARS</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <div class="wallet-currency-options" id="wallet-currency-options" hidden>
          <button class="wallet-currency-option is-selected" type="button" data-wallet-currency="stars" aria-pressed="true">STARS</button>
          <button class="wallet-currency-option" type="button" data-wallet-currency="gram" aria-pressed="false">GRAM</button>
        </div>
      </div>
    </div>
  </header>
  <main class="wallet-page">
    <section class="wallet-balance-card" aria-label="Баланс кошелька">
      <span class="wallet-card-spark wallet-spark-one" aria-hidden="true">✦</span>
      <span class="wallet-card-spark wallet-spark-two" aria-hidden="true">✦</span>
      <span class="wallet-card-spark wallet-spark-three" aria-hidden="true">✦</span>
      <span class="wallet-card-spark wallet-spark-four" aria-hidden="true">✦</span>
      <span class="wallet-card-spark wallet-spark-five" aria-hidden="true">✦</span>
      <div class="wallet-card-balance">
        <img src="./assets/stars.png" alt="" aria-hidden="true" data-wallet-stars-icon>
        <span class="wallet-balance-value" data-wallet-balance aria-live="polite">—</span>
        <span class="wallet-currency">STARS</span>
      </div>
      <p class="wallet-balance-usd" data-wallet-other-balance></p>
      <span class="wallet-account-name" data-wallet-account></span>
    </section>
    <div class="wallet-actions" aria-label="Операции с кошельком">
      <button class="wallet-action" type="button" aria-haspopup="dialog" aria-controls="wallet-topup-dialog" data-wallet-topup-open>
        <span>Пополнить</span>
      </button>
      <button class="wallet-action" type="button" disabled title="Вывод пока недоступен">
        <span>Вывести</span>
      </button>
    </div>
    <section class="wallet-transactions" aria-label="История операций" aria-busy="true" data-wallet-transactions>
      <p class="wallet-empty-state">Загрузка операций...</p>
    </section>
  </main>
  <dialog class="wallet-promo-dialog" id="wallet-promo-dialog" aria-labelledby="wallet-promo-title">
    <header class="wallet-promo-dialog-header">
      <h2 id="wallet-promo-title">Промокод</h2>
      <button class="wallet-promo-close" type="button" aria-label="Закрыть окно промокода">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
    </header>
    <section class="wallet-promo-section" aria-label="Активация промокода">
      <form class="wallet-promo-form">
        <label class="wallet-promo-input-label" for="wallet-promo-code">Ваш промокод</label>
        <div class="wallet-promo-input-row">
          <input id="wallet-promo-code" name="promo-code" type="text" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="VYRN-XXXX-XXXX-XXXX-XXXX" required>
          <button class="wallet-promo-submit" type="submit">Активировать</button>
        </div>
        <p class="wallet-promo-status" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </dialog>
  <dialog class="wallet-topup-dialog" id="wallet-topup-dialog" aria-labelledby="wallet-topup-title">
    <div class="wallet-topup-shell">
      <header class="wallet-topup-header">
        <button class="wallet-topup-close" type="button" aria-label="Закрыть окно пополнения" data-wallet-topup-close>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
        <div class="star-balance wallet-topup-balance" aria-label="Баланс: — звёзд">
          <img src="./assets/stars.png" alt="" aria-hidden="true">
          <span data-wallet-topup-balance>—</span>
        </div>
      </header>
      <main class="wallet-topup-content">
        <section class="wallet-topup-hero">
          <img class="wallet-topup-art" src="./assets/svg/star.svg" alt="" aria-hidden="true">
          <h2 id="wallet-topup-title">Купить звёзды</h2>
          <p>Выберите нужное количество звёзд.</p>
        </section>
        <section class="wallet-topup-amounts" aria-label="Выбор количества Stars">
          <div class="wallet-topup-packages">
            <button class="wallet-topup-package" type="button" data-wallet-topup-amount="100" aria-label="Купить 100 звёзд за 100 Telegram Stars">
              <span class="wallet-topup-package-name"><img src="./assets/stars.png" alt=""><span>100 звёзд</span></span><span class="wallet-topup-price">100 STARS</span>
            </button>
            <button class="wallet-topup-package" type="button" data-wallet-topup-amount="250" aria-label="Купить 250 звёзд за 250 Telegram Stars">
              <span class="wallet-topup-package-name"><img src="./assets/stars.png" alt=""><span>250 звёзд</span></span><span class="wallet-topup-price">250 STARS</span>
            </button>
            <button class="wallet-topup-package" type="button" data-wallet-topup-amount="500" aria-label="Купить 500 звёзд за 500 Telegram Stars">
              <span class="wallet-topup-package-name"><img src="./assets/stars.png" alt=""><span>500 звёзд</span></span><span class="wallet-topup-price">500 STARS</span>
            </button>
            <button class="wallet-topup-package" type="button" data-wallet-topup-amount="1000" aria-label="Купить 1 000 звёзд за 1 000 Telegram Stars">
              <span class="wallet-topup-package-name"><img src="./assets/stars.png" alt=""><span>1 000 звёзд</span></span><span class="wallet-topup-price">1 000 STARS</span>
            </button>
            <button class="wallet-topup-package" type="button" data-wallet-topup-amount="2500" aria-label="Купить 2 500 звёзд за 2 500 Telegram Stars">
              <span class="wallet-topup-package-name"><img src="./assets/stars.png" alt=""><span>2 500 звёзд</span></span><span class="wallet-topup-price">2 500 STARS</span>
            </button>
            <button class="wallet-topup-package" type="button" data-wallet-topup-amount="10000" aria-label="Купить 10 000 звёзд за 10 000 Telegram Stars">
              <span class="wallet-topup-package-name"><img src="./assets/stars.png" alt=""><span>10 000 звёзд</span></span><span class="wallet-topup-price">10 000 STARS</span>
            </button>
            <button class="wallet-topup-package" type="button" data-wallet-topup-amount="35000" aria-label="Купить 35 000 звёзд за 35 000 Telegram Stars">
              <span class="wallet-topup-package-name"><img src="./assets/stars.png" alt=""><span>35 000 звёзд</span></span><span class="wallet-topup-price">35 000 STARS</span>
            </button>
          </div>
          <button class="wallet-topup-more" type="button" aria-expanded="false" aria-controls="wallet-topup-form" data-wallet-topup-more>
            <span>Показать другие варианты</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <form class="wallet-topup-form" id="wallet-topup-form" data-wallet-topup-form hidden>
            <label class="wallet-topup-custom-label" for="wallet-topup-custom">Своё количество</label>
            <div class="wallet-topup-input-wrap">
              <input id="wallet-topup-custom" name="amount" type="number" min="1" max="100000" step="1" inputmode="numeric" placeholder="Введите число" required>
              <img src="./assets/stars.png" alt="">
            </div>
            <button class="wallet-topup-done" type="submit">Оплатить</button>
          </form>
        </section>
      </main>
    </div>
  </dialog>
  <div class="wallet-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
